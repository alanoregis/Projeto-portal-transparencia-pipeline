name: Pipeline Portal da Transparência (Diário)

on:
  # Agendamento diário: 04:00 UTC = 01:00 da manhã no horário de Fortaleza (UTC-3)
  schedule:
    - cron: '0 4 * * *'
  # Permite disparar manualmente pelo botão "Run workflow" no GitHub
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar Microsoft ODBC Driver 17 for SQL Server (Ubuntu)
        run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc
          curl https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql17 unixodbc-dev

      - name: Instalar Dependências do Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyodbc sqlalchemy "dlt[sql_database]" dbt-sqlserver

      - name: Instalar Dependências do dbt (dbt_utils)
        run: |
          cd dbt_transparencia
          dbt deps --profiles-dir .

      - name: Executar Pipeline de Engenharia de Dados (Bronze -> Silver -> Gold)
        env:
          AZURE_SQL_SERVER: ${{ secrets.AZURE_SQL_SERVER }}
          AZURE_SQL_DATABASE: ${{ secrets.AZURE_SQL_DATABASE }}
          AZURE_SQL_USER: ${{ secrets.AZURE_SQL_USER }}
          AZURE_SQL_PASSWORD: ${{ secrets.AZURE_SQL_PASSWORD }}
          AZURE_SQL_DRIVER: ${{ secrets.AZURE_SQL_DRIVER }}
          CGU_API_KEY: ${{ secrets.CGU_API_KEY }}
          INGESTION_MODE: "api"
          EXTRACT_MES_EXTRATO_INICIO: "01/2024"
          EXTRACT_MES_EXTRATO_FIM: "08/2026"
          MAX_PAGES_PER_MONTH: "1"
        run: |
          python run_pipeline.py

      # Etapa disparada quando o pipeline executa com SUCESSO
      - name: Enviar E-mail de Sucesso (Gmail)
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "✅ [SUCESSO] Pipeline Portal da Transparência Executado!"
          to: ${{ secrets.MAIL_USERNAME }}
          from: "Pipeline Transparência <${{ secrets.MAIL_USERNAME }}>"
          body: |
            Olá Alan,

            O pipeline de engenharia de dados do Portal da Transparência (CGU) foi executado com sucesso na nuvem!

            📊 Resumo da Execução:
            - Horário: 01:00 (Fortaleza - CE)
            - Camada Bronze: Ingestão de dados da CGU via dlthub finalizada.
            - Camadas Silver e Gold: Modelagem dimensional dbt-sqlserver concluída.
            - Testes de Qualidade: 48 testes validados com 100% de sucesso.
            - Banco Atualizado: Azure SQL Database (sqldb-transparencia).

            Os dados já estão disponíveis e prontos para consulta no Power BI!

            Repositório: https://github.com/${{ github.repository }}
            Detalhes do Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

      # Etapa disparada caso ocorra alguma FALHA
      - name: Enviar E-mail de Alerta de Falha (Gmail)
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "❌ [ALERTA DE FALHA] Pipeline Portal da Transparência Falhou!"
          to: ${{ secrets.MAIL_USERNAME }}
          from: "Pipeline Transparência <${{ secrets.MAIL_USERNAME }}>"
          body: |
            Atenção Alan,

            Ocorreu uma falha durante a execução do pipeline de dados do Portal da Transparência.

            Por favor, verifique os logs da execução no GitHub Actions para diagnosticar o erro:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}